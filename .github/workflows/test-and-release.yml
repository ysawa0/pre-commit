name: test and release

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile hooks
        run: python -m compileall -q hooks test
      - name: Run unit tests
        run: python -m unittest discover -s test -p '*_test.py' -v
      - name: Lint project prose
        run: |
          hooks/anti_slop.py --fail-level warning \
            README.md \
            CHANGELOG.md \
            docs/anti-slop.md \
            examples/anti-slop/README.md \
            examples/anti-slop/coffee-after.md \
            .github/release-notes/v0.2.0.md

  release:
    name: Publish requested release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create release when RELEASE changes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < RELEASE)"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "RELEASE must contain a semantic version such as v0.2.0" >&2
            exit 1
          fi
          notes=".github/release-notes/${version}.md"
          if [[ ! -f "$notes" ]]; then
            echo "Missing release notes: $notes" >&2
            exit 1
          fi
          if gh release view "$version" >/dev/null 2>&1; then
            echo "$version already exists; nothing to publish"
            exit 0
          fi
          gh release create "$version" \
            --target "$GITHUB_SHA" \
            --title "anti-slop $version" \
            --notes-file "$notes" \
            --latest
